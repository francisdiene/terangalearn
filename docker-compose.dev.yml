version: '3.8'

services:
  app-dev:
    image: node:20-alpine
    container_name: terangalearn-dev
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    command: sh -c "npm install && npm run dev"
    networks:
      - terangalearn-network

  postgres:
    image: postgres:16-alpine
    container_name: terangalearn-db
    environment:
      POSTGRES_USER: terangalearn
      POSTGRES_PASSWORD: terangalearn2024
      POSTGRES_DB: terangalearn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - terangalearn-network

networks:
  terangalearn-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local