version: '3.8'

services:
  # ================================
  # Service Next.js (TerangaLearn)
  # ================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: terangalearn-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: unless-stopped
    networks:
      - terangalearn-network

  # ================================
  # Service PostgreSQL local (dev)
  # ================================
  postgres:
    image: postgres:16-alpine
    container_name: terangalearn-db
    environment:
      POSTGRES_USER: terangalearn
      POSTGRES_PASSWORD: terangalearn2024
      POSTGRES_DB: terangalearn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - terangalearn-network

  # ================================
  # Adminer — Interface base de données
  # ================================
  adminer:
    image: adminer
    container_name: terangalearn-adminer
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - terangalearn-network
    depends_on:
      - postgres

networks:
  terangalearn-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local